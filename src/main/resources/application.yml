spring:
  application:
    name: study-groups
  profiles:
    default: server
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-float-as-int: false
      fail-on-null-for-primitives: true

app:
  jpa:
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: server
  datasource:
    jndi-name: ${DATASOURCE_JNDI:java:jboss/datasources/StudyGroupsDS}
